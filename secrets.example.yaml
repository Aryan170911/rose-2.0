# secrets.example.yaml — copy to secrets.local.yaml and fill in
# This file is the machine-readable version of API_KEYS.md (for CLIs / scripts)
# DO NOT commit secrets.local.yaml — already in .gitignore

# 1. Telegram
telegram:
  bot_token: "your-bot-token-from-botfather"
  bot_username: "your_bot_username"
  owner_id: 123456789          # numeric Telegram user ID of Mikey
  owner_username: "your_username"
  owner_fullname: "Your Name"
  # optional second superuser (collaborator with owner-level powers)
  mirandi_id: 0                # numeric Telegram user ID (0 = disabled)

# 2. MongoDB
mongodb:
  uri: "mongodb+srv://user:pass@cluster.mongodb.net/?appName=app"
  db_name: "hinata_mikey_db"

# 3. AI provider — pick one (groq, nvidia, openrouter, gemini, openai, ollama)
ai:
  provider: "groq"
  # Per-provider keys (all optional; AI_API_KEY is the fallback)
  api_key: "fallback-key"            # generic fallback
  groq_api_key: "gsk_..."
  nvidia_api_key: "nvapi-..."
  openrouter_api_key: "sk-or-v1-..."
  gemini_api_key: "AIza..."
  # Models
  model: "qwen/qwen3.8-27b"          # chat
  code_model: "qwen/qwen3.6-27b"     # code (auto-routed)
  code_provider: "groq"              # provider for code model
  base_url: ""                       # custom (e.g. ollama)
  # Behavior
  enabled: true
  trigger_mode: "mention_or_reply"   # always | mention | mention_or_reply | admin_only
  # Tone
  persona_name: "Hinata"
  owner_name: "Mikey"

# 4. Moderation defaults
moderation:
  warn_limit: 3
  flood_limit: 5
  flood_window: 5                 # seconds
  antiraid_enabled: true
  antiraid_threshold: 5           # joins in 10s
  antiraid_window: 10

# 5. Deployment
deployment:
  mode: "polling"                 # polling | webhook
  webhook_url: ""                 # only for webhook mode
  webhook_secret: ""              # optional
  port: 8443
  database_path: "./data/bot.db"  # legacy, mongo is primary

# 6. Logging
logging:
  log_channel_id: 0                # optional Telegram channel for audit mirror

# 7. GitHub (for self-update / fix-request workflow)
github:
  token: "github_pat_..."
  repo: "owner/repo"
